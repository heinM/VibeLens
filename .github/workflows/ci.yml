name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: VibeLens

jobs:
  audit:
    name: Dependency audit (RustSec, npm)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 · Node 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: VibeLens
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 · Node 24
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm audit --audit-level=high

  core-linux:
    name: Core · Linux (fmt, clippy, tests vs real Postgres + Valkey)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: vibelens
          POSTGRES_DB: vibelens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
    env:
      VG_TEST_PG: host=127.0.0.1 port=5432 user=postgres password=vibelens dbname=vibelens_test
      VG_TEST_VALKEY: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 · Node 24
      - name: System deps (WebKitGTK for the Tauri shell)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: VibeLens
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p vibelens-core

  core-native:
    name: Core · ${{ matrix.os }} (keychain + platform code compiles)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 · Node 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: VibeLens
      - run: cargo check -p vibelens-core --all-targets
      - run: cargo test -p vibelens-core --lib

  frontend:
    name: Frontend (typecheck, unit tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 · Node 24
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 · Node 24
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: VibeLens/package-lock.json
      - run: scripts/check-case-collisions.sh
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
