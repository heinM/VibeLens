[package]
name = "vibelens-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "VibeLens engine core: Postgres/Valkey drivers, AWS identity, tunnels, agent runtime. No Tauri dependency."

[features]
default = ["iceberg"]
# Apache Iceberg: REST / Glue / S3 Tables / SQL catalogs, local DataFusion engine, Athena engine.
# Adds DataFusion + Arrow (several minutes to a clean build, tens of MB to the binary).
iceberg = [
    "dep:iceberg", "dep:iceberg-catalog-rest", "dep:iceberg-catalog-glue", "dep:iceberg-catalog-s3tables",
    "dep:iceberg-catalog-sql", "dep:iceberg-datafusion", "dep:datafusion", "dep:sqlx",
    "dep:aws-sdk-athena", "dep:aws-sdk-s3tables", "dep:iceberg-storage-opendal", "dep:reqwest012", "dep:typetag",
]
# Hive Metastore catalog (Thrift via volo/pilota). Off by default: heavy, and no Kerberos support.
iceberg-hms = ["iceberg", "dep:iceberg-catalog-hms"]
# Test hooks (endpoint overrides that point signed AWS requests at a mock). Never in the app:
# only the crate's own integration tests turn it on, through the dev-dependency on itself below.
test-util = []

[dependencies]
async-trait = "0.1.92"
aws-config = { version = "1.13.0", features = ["behavior-version-latest"] }
aws-credential-types = "1.3.1"
aws-sdk-athena = { version = "1.127.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
# Same version iceberg uses: its StorageFactory trait objects are typetag-serialized.
typetag = { version = "0.2.23", optional = true }
aws-sdk-rds = { version = "1.159.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
# Amazon Redshift through the Data API (SigV4, no database password on the machine).
aws-sdk-redshiftdata = { version = "1.126.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3tables = { version = "1.76.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-secretsmanager = { version = "1.125.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sso = { version = "1.119.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssooidc = { version = "1.121.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sigv4 = "1.6.4"
aws-smithy-async = "1.3.1"
aws-smithy-runtime-api = "1.19.2"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
datafusion = { version = "54", optional = true }
deadpool = { version = "0.13.1", default-features = false, features = ["managed", "rt_tokio_1"] }
dirs = "7.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
iceberg = { version = "0.11.0", optional = true }
iceberg-catalog-glue = { version = "0.11.0", optional = true }
iceberg-catalog-hms = { version = "0.11.0", optional = true }
iceberg-catalog-rest = { version = "0.11.0", optional = true }
iceberg-catalog-s3tables = { version = "0.11.0", optional = true }
iceberg-catalog-sql = { version = "0.11.0", optional = true }
iceberg-datafusion = { version = "0.11.0", optional = true }
iceberg-storage-opendal = { version = "0.11.0", optional = true }
keyring-core = "1.0.1"
# MySQL / Aurora MySQL / RDS MySQL. rustls only (no OpenSSL, no native-tls), compression via
# miniz_oxide. Patched copy in vendor/mysql_async (see its PATCH.md).
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "aws-lc-rs", "tls12"] }
# Reading DataGrip / IntelliJ dataSources.xml for the connection importer (already in the lockfile via Tauri).
quick-xml = "0.42"
redis = { version = "1.8.1", features = ["tokio-comp", "tokio-rustls-comp", "cluster-async", "connection-manager", "aio", "tls-rustls-insecure"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2", "charset"] }
reqwest012 = { version = "0.12", package = "reqwest", default-features = false, features = ["json", "rustls-tls-native-roots"], optional = true }
russh = "0.65.0"
rustls = "0.23.46"
rustls-native-certs = "0.8.5"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlparser = "0.63.0"
sqlx = { version = "0.8", features = ["sqlite", "postgres", "any", "runtime-tokio"], optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = "0.14.0"
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zeroize = "1.9.1"

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW / O_NONBLOCK when opening a file picked for import.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
# Turns on `test-util` for this crate's integration tests (`tests/redshift_*`), so a plain
# `cargo test -p vibelens-core` runs them; release builds of the app never see the hooks.
vibelens-core = { path = ".", features = ["test-util"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full", "test-util"] }

